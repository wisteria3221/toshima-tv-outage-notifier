name: Lint and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 障害チェック（check-outage.yml）は 10 分ごとに動くため、Lint とテストはそちらで毎回は実行せず
# push / PR 時にここで実行する。checkout と依存インストールを 1 回で済ませるため 1 ジョブにまとめ、
# Lint が失敗してもテスト結果は分かるようにテストのステップは常に実行する。
jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Python は .python-version に従って uv がインストールする
      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Run Ruff formatter check
        run: uv run ruff format --check .

      - name: Run tests
        if: ${{ !cancelled() }}
        run: uv run pytest -v
