name: Check Toshima TV Outage

on:
  schedule:
    # GitHub の schedule はベストエフォートで、実績では 1 日 4〜7 回しか起動しない期間があった。
    # 主系は外部 cron（cron-job.org）から 10 分ごと（7,17,...,57 分）に workflow_dispatch を呼ぶ構成とし、
    # ここは外部 cron が止まったときのための 1 時間に 1 回のフォールバック。
    # 主系と同じ分（27 分）に揃える。ずらすと主系が生きているときに 10 分未満の間隔で取得してしまう
    # （CLAUDE.md「間隔を 10 分より詰めない」）。同じ分なら concurrency で直列化され、2 本目は変更なしで終わる。
    # 混雑しやすい 0 分前後は避ける。
    - cron: '27 * * * *'
  workflow_dispatch:  # 手動実行および外部 cron からの起動用

permissions:
  contents: write  # 状態ファイルのコミット用

# schedule と外部起動が重なっても data/state.json の push が衝突しないよう直列化する。
# 実行中のランは止めず、後続を待たせる（cancel-in-progress: false）。
concurrency:
  group: check-outage
  cancel-in-progress: false

jobs:
  check-outage:
    runs-on: ubuntu-latest
    env:
      # Healthchecks.io の Ping URL（任意）。未設定なら死活報告ステップはスキップされる。
      # GitHub 側の schedule 間引きやランナー障害で「そもそも起動していない」状態を検知するため、
      # 成功時のみ通常 ping を送り、一定時間 ping が途絶えたら Healthchecks 側がアラートする。
      HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Python は .python-version に従って uv がインストールする
      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # Lint とテストは push / PR 時に lint.yml で実行する（10 分ごとの定期実行では重複させない）。
      # 実行に必要なのは本体の依存だけなので dev extras は入れない。
      - name: Install dependencies
        run: uv sync --frozen

      - name: Run outage checker
        id: checker
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          TZ: Asia/Tokyo
        # 終了コードの意味は src/main.py の EXIT_* 定数を参照
        #   0: 成功
        #   1: 通知失敗など気づくべき失敗 → ジョブを失敗させる
        #      （通知に成功した分の状態は保存されているのでコミットし、失敗分は次回再試行）
        #   2: としまテレビ側に到達できない（一時的） → 警告のみでジョブは成功扱い
        run: |
          code=0
          uv run python -m src.main || code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "::warning title=Upstream unavailable::としまテレビの障害情報ページに到達できませんでした（タイムアウト/DNS 失敗など）。次回実行で再試行します。"
            exit 0
          fi
          exit "$code"

      # 終了コード 1 でもコミットする。部分失敗時に成功した通知のマークを捨てると、
      # 次回実行で同じ障害を二重投稿してしまうため。
      # 終了コード 2（上流不通）やステップ自体の異常終了（exit_code 未設定）ではコミットしない。
      - name: Commit state changes
        id: commit
        if: ${{ !cancelled() && contains(fromJSON('["0", "1"]'), steps.checker.outputs.exit_code) }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/state.json
          if git diff --staged --quiet; then
            echo "状態ファイルに変更はありません"
            exit 0
          fi
          git commit -m "chore: Update outage state [skip ci]"
          # concurrency は Actions 同士しか直列化しないため、人が main に push した直後の
          # 実行では push が拒否される。そのまま失敗すると投稿済みの状態がコミットされず
          # 次回実行で二重投稿になるので、リベースして 1 回だけ再試行する。
          #   -X theirs: rebase では「再適用する側」= このランのコミット。state.json が衝突したら
          #              投稿済みツイートを反映しているランの内容を優先する（人の編集は本人がやり直せる）
          #   JSON 検証: 行単位のマージは JSON の構文を保証しない。壊れた state.json を push すると
          #              以降の全実行が StateFileError で止まるため、push 前に読めることを確認する
          git push || {
            echo "push が拒否されたためリベースして再試行します"
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME" \
              && python3 -m json.tool data/state.json > /dev/null \
              && git push
          } || {
            echo "::error title=State push failed::リベース後の data/state.json を push できませんでした（衝突または JSON 破損）。手動で修復してください。"
            exit 1
          }

      # 死活報告（dead-man's switch）。常に実行し、結果に応じて送り先を変える。
      #   成功(0)      → 通常 ping（Healthchecks の期限をリセット）
      #   上流不通(2)  → /log（記録のみ。期限はリセットしないので、長引けば未起動と同様にアラート）
      #   それ以外     → /fail（即時アラート。依存インストール失敗などで exit_code が空の場合も含む）
      #   状態のコミット/push に失敗した場合も /fail（checker は 0 でも、投稿済みの状態が
      #   保存されておらず次回二重投稿の恐れがあるため）
      - name: Report to Healthchecks.io
        if: always() && env.HEALTHCHECKS_URL != ''
        env:
          EXIT_CODE: ${{ steps.checker.outputs.exit_code }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
        run: |
          if [ "$COMMIT_OUTCOME" = "failure" ]; then
            endpoint="/fail"
          else
            case "$EXIT_CODE" in
              0) endpoint="" ;;
              2) endpoint="/log" ;;
              *) endpoint="/fail" ;;
            esac
          fi
          curl -fsS -m 10 --retry 3 -o /dev/null \
            --data-raw "run_id=${GITHUB_RUN_ID} exit_code=${EXIT_CODE:-none} commit=${COMMIT_OUTCOME:-none}" \
            "${HEALTHCHECKS_URL}${endpoint}"
